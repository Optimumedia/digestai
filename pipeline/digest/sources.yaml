# Curated sources. Keys are stable identifiers; edit freely, the fetcher syncs this file
# into the sources table on every run (discovered sources are managed by rank.py).
#
# fields: name, url, kind (rss|hn|reddit), category (hint), weight (0-2),
#         fulltext (false = show digest only, never republish body),
#         content_from_feed (true = trust the feed body, do not fetch the page),
#         max_items (per run), agent (browser = a browser-like User-Agent),
#         fallback (a feed read when the main one fails or is empty),
#         keep_domain (only fallback items on this domain; the main feed is never filtered by it),
#         link_from (description = the article is the first outside link in the item's HTML),
#         ai_only (only items whose title or summary is about AI),
#         stale_days (warn when the newest entry is older than this; default fetch.STALE_DAYS, 60)
#
# Health (fetch.py): a source that fails three runs in a row, or answers 429 once, rests for an hour,
# then two, four ... up to a day between tries. A feed that answers with no entries, or whose newest
# entry is older than stale_days, gets a "stale:" or "empty:" note in last_error (the admin page shows
# it) without counting as a failure.
#
# Every feed added on 26 Nov 2026 was fetched first and returned entries from the last two weeks;
# its newest AI item's page was read with the pipeline's own extractor.

# Source types drive the coverage bar on the site: primary = the lab, paper or company itself;
# newsletter = independent writers; community = Hacker News, Reddit, Lobsters; everything
# else is press.
types:
  primary: [openai, google-ai, deepmind, google-research, microsoft-blog, azure-ai, nvidia-blog,
            huggingface, aws-ml, apple-ml, anthropic, anthropic-eng, anthropic-research, mistral, mit-news-ai,
            arxiv-cs-ai, arxiv-cs-cl, nature-ml, gemini, google-cloud-ai, microsoft-research, ai2, ollama,
            cloudflare-ai, salesforce-news, meta-engineering,
            # companies' own announcements in the Marketing & Small Business feeds
            google-ads-commerce, meta-newsroom, hubspot-product, notion-releases, shopify-changelog,
            google-workspace-updates, google-search-central, google-small-business, youtube-blog, stripe-blog]
  newsletter: [import-ai, interconnects, latent-space, simon-willison, one-useful-thing, ai-snake-oil,
               raschka, last-week-in-ai, rundown, bens-bites, towards-ds, eu-ai-act, semianalysis]
  community: [hn, reddit-ai, lobsters-ai, mastodon-trends, techmeme]

