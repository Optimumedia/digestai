# Curated sources. Keys are stable identifiers; edit freely, the fetcher syncs this file
# into the sources table on every run (discovered sources are managed by rank.py).
#
# fields: name, url, kind (rss|hn|reddit), category (hint), weight (0-2),
#         fulltext (false = show digest only, never republish body),
#         content_from_feed (true = trust the feed body, do not fetch the page),
#         max_items (per run)

# Source types drive the coverage bar on the site: primary = the lab, paper or company itself;
# newsletter = independent writers; community = Hacker News, Reddit, Product Hunt; everything
# else is press.
types:
  primary: [openai, google-ai, deepmind, google-research, microsoft-blog, azure-ai, meta-ai, nvidia-blog,
            huggingface, aws-ml, apple-ml, anthropic, anthropic-eng, mistral, bair, mit-news-ai,
            arxiv-cs-ai, arxiv-cs-cl, nature-ml]
  newsletter: [import-ai, interconnects, latent-space, simon-willison, one-useful-thing, ai-snake-oil,
               raschka, last-week-in-ai, rundown, bens-bites, towards-ds, eu-ai-act, semianalysis]
  community: [hn, reddit-ml, reddit-localllama, reddit-artificial, reddit-singularity, producthunt-ai]

