  # Techmeme: the fastest free signal for big tech news, and only the way it is found. Each item links
  # a techmeme.com permalink; the original article is the first outside link in the item's HTML, and
  # that address is stored, so the outlet is credited (Techmeme shows as "via") and the outlet's own
  # feed finds it already known. ai_only keeps the tech items that are not about AI out before any
  # page is fetched; the gate checks the rest. Fifteen items a feed, about ten new a day.
  - key: techmeme
    name: Techmeme
    url: https://www.techmeme.com/feed.xml
    link_from: description
    category: business
    weight: 1.2
    ai_only: true
    max_items: 15
