# Editorial controls that work without a database console. Edit this file on GitHub
# (the pencil icon), commit, and the next run applies it.
#
# unpublish: story slugs (the part after /story/) that must disappear from the site.
# pin:       story slugs to keep at the top of the front page and the briefing.
# approve:   held story slugs you checked and want published. Single-source stories about crimes,
#            weapons, surveillance or wrongdoing by named people or companies wait for approval
#            (admin page, Today tab, "Held for your approval"); a second publisher releases them too.
# block_domains: publishers whose articles are never shown.
# block_title_words: a story whose headline contains any of these words is rejected.

unpublish:
  # 2019 OpenAI post re-shared on Hacker News with "(2019)" in the title; shown as new by mistake.
  - openai-restricts-gpt-2-release-over-malicious-use-concerns
pin: []
approve: ["cohere-ceo-warns-ai-models-are-most-powerful-cyber-weapon-yet", "xai-and-x-corp-settle-antitrust-lawsuit-vs-apple", "openai-secures-200m-pentagon-deal-with-strict-safety-guardrails", "meta-faces-class-action-over-ai-training-and-facial-recognition-claims", "hawley-demands-openai-records-after-agents-breached-hugging-face", "anthropic-reports-chinese-state-actors-used-claude-to-surveil-dissidents-and", "ai-lawsuits-pile-up-meta-settles-18b-doj-upholds-fair-use", "essay-argues-ai-agents-math-breakthrough-and-security-breach-share-same-root", "timnit-gebru-ai-doom-talk-distracts-from-real-world-harms-like-weapons-and-labor", "ai-in-anti-money-laundering-use-cases-benefits", "anthropic-faces-class-action-lawsuit-over-alleged-deceptive-claude-usage-limits", "anthropic-s-1-5-b-copyright-settlement-sparks-disputes-over-author-payments"]
block_domains: []
block_title_words: []
