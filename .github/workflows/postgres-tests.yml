name: postgres-tests

# The release safety net. It deploys nothing and needs no secret.
# - python: every pipeline test file (tests/run_all.py finds them; nothing is listed here by hand),
#   first on a real Postgres for the files that use TEST_POSTGRES_URL (change tracking, the runner
#   cache, storage clean-up and the events guard are Postgres-only SQL), then all of them on SQLite.
# - site: builds the site from the test fixture (tests/site_fixture.py: made-up stories through the
#   real export, admin and team steps, no publisher text), then runs every test that reads site/dist,
#   including the smoke test of home, /today, a story, /models, /work, /admin and /admin/team. A page
#   template that breaks fails here instead of on digestai.news.
# --strict: a test that prints SKIP (no Node, no built site) fails instead of passing quietly.
on:
  push:
    branches: ["main", "staging", "pg-check", "pg-check/**"]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # Several tests run the site's own rules (site/src/lib/*.mjs, public/app.js) in Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pipeline
        run: pip install -q -r pipeline/requirements.txt
      - name: Pipeline tests
        working-directory: pipeline
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/digest
        run: python tests/run_all.py --group python --strict --ci --jobs 4

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pipeline
        # fonttools and brotli: only for test_site_speed's check that the trimmed font keeps its shapes.
        run: pip install -q -r pipeline/requirements.txt fonttools brotli
      - name: Write the test fixture
        working-directory: pipeline
        run: python tests/site_fixture.py
      - name: Build site
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build
      - name: Built-site tests
        working-directory: pipeline
        run: python tests/run_all.py --group site --strict --ci
