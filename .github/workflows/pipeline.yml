name: Ingest and publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps (all, or e.g. 'fetch extract')"
        default: "all"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SITE_URL: https://digestai.news
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      NEWSLETTER_HOUR_UTC: ${{ vars.NEWSLETTER_HOUR_UTC || '5' }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Cache share images
        uses: actions/cache@v4
        with:
          path: site/public/og
          key: og-images-${{ github.run_id }}
          restore-keys: og-images-

      - name: Install pipeline
        run: pip install -q -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        run: python -m digest.run ${{ github.event.inputs.steps || 'all' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_KIT_FORM_URL: ${{ vars.PUBLIC_KIT_FORM_URL }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
        run: npm ci && npm run build

      # Direct upload from the runner: does not count against Cloudflare's 500 builds/month.
      # Skipped until the Cloudflare secrets exist, so the workflow is safe to enable on day one.
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=digestai --commit-dirty=true
