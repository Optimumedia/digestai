name: Ingest and publish

on:
  schedule:
    # Every 20 minutes, so a story reaches the site within about half an hour of its source. Runs
    # read only what changed (~1 MB a run, see the admin Pipeline tab): 72 a day is about 2.2 GB of
    # the free plan's 5 GB a month. Keep RUN_MINUTES and RUNS_PER_DAY below in step with this line.
    - cron: "7,27,47 * * * *"
  # GitHub delivers scheduled events late or not at all under load: from 11 Oct 2026 this one fired
  # a few times a day instead of 72. So each run also queues the next one (the "next" job below),
  # which waits until 20 minutes after this one started (the "pace" job) before it starts work. A scheduled event
  # that does arrive finds a run already queued and is dropped by the concurrency rule, so the two
  # never double up.
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps (all, or e.g. 'fetch extract')"
        default: "all"
      chained:
        description: "Queued by the previous run: wait for its turn first"
        type: boolean
        default: false
      after:
        description: "Queued by the previous run: when its pipeline job started (Unix seconds)"
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  # write: the media store and the database backup are release assets (pipeline/digest/media.py,
  # backup.py). Releases and tags made with this token start no workflow, so nothing loops.
  contents: write
  pages: write
  id-token: write
  actions: write  # the "next" job queues the following run (workflow_dispatch)
  issues: write

jobs:
  # A run queued by the one before waits here until 20 minutes after that run's pipeline job started
  # (pipeline/digest/pace.py), so runs never start closer together than that and the free-model and
  # database budgets, which assume RUNS_PER_DAY, stay right. Until 26 Nov 2026 it waited for the next
  # 7, 27 or 47 past the hour instead: a 21-minute job always just missed its slot and runs started
  # every 40 minutes. A run queued without a start time (by an older copy of this file) still does.
  pace:
    if: github.event_name == 'workflow_dispatch' && inputs.chained
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline/digest
      - name: Wait for this run's turn
        working-directory: pipeline
        env:
          AFTER: ${{ inputs.after }}
          PACE_MINUTES: "20"
          RUN_MINUTES: "7,27,47"
        run: |
          wait=$(python3 -m digest.pace) || wait=0
          case "$wait" in ''|*[!0-9]*) wait=0;; esac
          sleep "$wait"

  pipeline:
    needs: pace
    # Runs after the wait, or at once when there was nothing to wait for (a scheduled or manual run).
    if: ${{ !cancelled() && (needs.pace.result == 'success' || needs.pace.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Set-up, the 20-minute pipeline step, a five-minute build and the deploy: 28 left no room.
    timeout-minutes: 32
    outputs:
      # When this job started, for the next run's pace job.
      started: ${{ steps.start.outputs.at }}
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url || steps.pages2.outputs.page_url || steps.pages3.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # OpenRouter free models: 50 requests a day without credits; the pipeline stops at this many (default 45).
      OPENROUTER_DAILY_REQUESTS: ${{ vars.OPENROUTER_DAILY_REQUESTS }}
      # Workers AI free plan: 10,000 neurons a day; the pipeline stops at this many (default 9000).
      CLOUDFLARE_DAILY_NEURONS: ${{ vars.CLOUDFLARE_DAILY_NEURONS }}
      # Mistral's Free plan is $10 a month; the pipeline stops at this month-to-date spend (default 9).
      MISTRAL_MONTHLY_CAP_USD: ${{ vars.MISTRAL_MONTHLY_CAP_USD }}
      SITE_URL: https://digestai.news
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      NEWSLETTER_HOUR_UTC: ${{ vars.NEWSLETTER_HOUR_UTC || '5' }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      ADMIN_REVIEW_KEY: ${{ secrets.ADMIN_REVIEW_KEY }}
      HOLD_RISKY_CLAIMS: ${{ vars.HOLD_RISKY_CLAIMS }}
      RUNS_PER_DAY: "72"
      RUN_MINUTES: "7,27,47"
      SUPABASE_CYCLE_DAY: ${{ vars.SUPABASE_CYCLE_DAY || '11' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      AUDIO_ENGINE: ${{ vars.AUDIO_ENGINE || 'kokoro' }}
      AUDIO_VOICE: ${{ vars.AUDIO_VOICE || 'af_heart' }}
      AUDIO_PIPER_VOICE: ${{ vars.AUDIO_PIPER_VOICE || 'en_US-lessac-medium' }}
      # Seconds the audio step may spend reading before it leaves the rest for the next run. Empty
      # keeps the default in pipeline/digest/config.py; raise it on a faster runner.
      AUDIO_TIME_BUDGET_SECONDS: ${{ vars.AUDIO_TIME_BUDGET_SECONDS }}
      # The AI at Work episode shares that budget, behind the briefing. Empty keeps the defaults:
      # Monday (0) from AUDIO_HOUR_UTC, six items, and WORK_AUDIO=0 turns the second show off.
      WORK_AUDIO: ${{ vars.WORK_AUDIO }}
      WORK_AUDIO_WEEKDAY: ${{ vars.WORK_AUDIO_WEEKDAY }}
      WORK_AUDIO_HOUR_UTC: ${{ vars.WORK_AUDIO_HOUR_UTC }}
      WORK_AUDIO_ITEMS: ${{ vars.WORK_AUDIO_ITEMS }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      # Pinned release of the local model's server (the "Start local model" step).
      OLLAMA_VERSION: "0.12.3"
      GEMINI_DAILY_BUDGET: ${{ vars.GEMINI_DAILY_BUDGET || '54' }}
      MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN || '20' }}
      GH_TOKEN: ${{ github.token }}
      # The morning note (pipeline/digest/morning.py): written on the first run from this hour UTC and
      # opened as a "morning-note" issue (issues: write above). MORNING_NOTE_MENTION is a GitHub
      # username to @mention in it, which notifies that person even without watching the repository.
      MORNING_NOTE_HOUR_UTC: ${{ vars.MORNING_NOTE_HOUR_UTC || '5' }}
      MORNING_NOTE_MENTION: ${{ vars.MORNING_NOTE_MENTION }}
      # Passphrase that encrypts the nightly database backup (SETUP.md, "Database backup").
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      # Optional: a healthchecks.io ping URL, pinged at the end of every run.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - name: Note the start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Local model: the only summariser when no API key exists, and the safety net when the keyed
      # providers run out of quota. Its files are cached, and so is the Ollama program itself (without
      # its GPU libraries: the runner has none). It starts in the background, while the job sets up and
      # the pipeline fetches; the pipeline waits for it before summaries (run.wait_for_local_model).
      # Until 26 Nov 2026 the installer ran in the foreground of every run: a minute of each job.
      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Cache local model program
        uses: actions/cache@v4
        with:
          path: ~/.ollama-runtime
          key: ollama-runtime-${{ env.OLLAMA_VERSION }}-cpu

      - name: Start local model
        run: |
          echo starting > /tmp/ollama.state
          echo "OLLAMA_STATE_FILE=/tmp/ollama.state" >> "$GITHUB_ENV"
          echo "OLLAMA_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/start-ollama.sh" <<'EOF'
          set -u -o pipefail
          say() { echo "$(date -u +%H:%M:%S) $*"; }
          fail() { say "$*"; echo failed > /tmp/ollama.state; exit 1; }
          rt="$HOME/.ollama-runtime"
          bin="$rt/bin/ollama"
          if [ ! -x "$bin" ]; then
            say "downloading Ollama $OLLAMA_VERSION"
            part="$RUNNER_TEMP/ollama-part"; rm -rf "$part"; mkdir -p "$part"
            # The file the official installer downloads for this version, unpacked without the GPU libraries.
            if curl -fsSL --retry 3 "https://ollama.com/download/ollama-linux-amd64.tgz?version=$OLLAMA_VERSION" \
                | tar -xzf - -C "$part" --exclude='cuda_*' --exclude='rocm*' --exclude='vulkan*' && [ -x "$part/bin/ollama" ]; then
              # Kept in the cache only when small: a layout change that kept the GPU libraries must not
              # fill the repository's 10 GB of caches.
              if [ "$(du -sm "$part" | cut -f1)" -le 600 ]; then rm -rf "$rt"; mv "$part" "$rt"; else bin="$part/bin/ollama"; fi
            else
              say "direct download failed; running the installer"
              curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh >/dev/null 2>&1 || fail "the installer failed"
              sudo systemctl stop ollama >/dev/null 2>&1 || true  # the installer's own service; ours reads the cached models
              bin=$(command -v ollama) || fail "no ollama after the installer"
            fi
          fi
          export OLLAMA_MODELS="$HOME/.ollama/models"
          "$bin" serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || fail "the server did not start"
          if ! "$bin" show "$OLLAMA_MODEL" >/dev/null 2>&1; then
            say "pulling $OLLAMA_MODEL"
            "$bin" pull "$OLLAMA_MODEL" 2>&1 | tail -1
          fi
          "$bin" show "$OLLAMA_MODEL" >/dev/null 2>&1 || fail "$OLLAMA_MODEL is not available"
          say "ready"
          echo ready > /tmp/ollama.state
          EOF
          nohup bash "$RUNNER_TEMP/start-ollama.sh" > /tmp/ollama-start.log 2>&1 &

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Restore database
        id: dbcache
        if: env.DATABASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Restore database from backup artifact
        if: env.DATABASE_URL == '' && steps.dbcache.outputs.cache-matched-key == ''
        run: |
          mkdir -p pipeline/data
          run_id=$(gh run list --workflow "Ingest and publish" --status success --limit 30 --json databaseId -q '.[].databaseId' | while read id; do
            if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.artifacts[].name' | grep -qx digest-db; then echo "$id"; break; fi; done)
          if [ -n "$run_id" ]; then gh run download "$run_id" -n digest-db -D pipeline/data && echo "restored backup from run $run_id"; else echo "no backup yet"; fi

      - name: Install pipeline
        run: pip install -q -r pipeline/requirements.txt

      # The spoken briefing's voice (pipeline/digest/audio.py). Kokoro's two model files come from
      # the kokoro-onnx release once and are cached after that; the Piper voice stays as the
      # fallback the audio step uses when they are missing.
      - name: Cache Kokoro model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: pipeline/data/kokoro
          key: kokoro-model-files-v1.0

      - name: Download Kokoro model
        if: steps.kokoro.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          tmp=$(mktemp -d)
          # Both files, or neither: a half-downloaded voice must not end up in the cache.
          curl -fsSL --retry 3 -o "$tmp/kokoro-v1.0.int8.onnx" "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL --retry 3 -o "$tmp/voices-v1.0.bin" "$base/voices-v1.0.bin"
          mkdir -p pipeline/data/kokoro
          mv "$tmp"/* pipeline/data/kokoro/
          ls -l pipeline/data/kokoro

      - name: Cache Piper voice
        id: voice
        uses: actions/cache@v4
        with:
          path: pipeline/data/voices
          key: piper-voice-${{ vars.AUDIO_PIPER_VOICE || 'en_US-lessac-medium' }}

      - name: Download Piper voice
        if: steps.voice.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m piper.download_voices "${AUDIO_PIPER_VOICE:-en_US-lessac-medium}" --download-dir pipeline/data/voices

      # Without a Supabase DATABASE_URL the SQLite database persists between runs through the
      # Actions cache, with a daily artifact as backup. The cache is restored from the most
      # recent run; if it is missing, the last backup artifact is used.

      # What earlier runs already read from the database (pipeline/digest/cache.py): each run then asks
      # only for rows written since. One small entry per run under a shared prefix; the newest is
      # restored. Without it a run reads everything once, which costs reads but changes no result.
      # It also carries the parts of a spoken briefing that is still being read (audio.py): losing
      # them costs one episode's synthesis, never a wrong result.
      - name: Restore read cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/cache
          key: read-cache-v1-${{ github.run_id }}
          restore-keys: read-cache-v1-

      # Every share image, thumbnail and spoken briefing is kept in the media store (release assets,
      # pipeline/digest/media.py). Pages also serves the share cards of the last 7 days' stories, thread
      # and topic cards (site/public/og, ~35 MB) and the newest 7 episodes (site/public/audio, ~17 MB),
      # because the store's downloads carry no image or audio type. Those two folders are saved once a
      # day (cards) and when a new episode appears, not every run; anything missing is rendered again or
      # downloaded from the store. The old per-run og-images-/audio- entries expire after 7 days unused;
      # the audio- prefix below carries the existing episodes over once.
      - name: Today's date
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore share cards
        id: ogcache
        uses: actions/cache/restore@v4
        with:
          path: site/public/og
          key: og-cards-${{ steps.day.outputs.day }}
          restore-keys: og-cards-

      - name: Restore recent spoken briefings
        id: audiocache
        uses: actions/cache/restore@v4
        with:
          path: site/public/audio
          key: audio-recent-none
          restore-keys: |
            audio-recent-
            audio-

      # The backup's remembered table rows (a few MB) are needed only by the run that makes the daily
      # backup (pipeline/digest/backup.py), so they are restored and saved on that run only.
      - name: Decide on database backup
        id: dbbackup
        run: |
          due=$(python -c "import json,datetime as d
          try: last=json.load(open('pipeline/data/cache/backup/state.json')).get('lastAt')
          except Exception: last=None
          print('yes' if not last or (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(last)).total_seconds()>=20*3600 else 'no')")
          if [ -z "$BACKUP_KEY" ]; then due=no; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Restore backup store
        if: steps.dbbackup.outputs.due == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/backup-store
          key: backup-store-${{ github.run_id }}
          restore-keys: backup-store-

      # The pipeline has its own limit inside the job's 28 minutes and may fail or time out
      # without stopping the job: the build and deploy steps below still publish what was exported.
      - name: Run pipeline
        id: pipeline
        working-directory: pipeline
        timeout-minutes: 20
        continue-on-error: true
        run: python -m digest.run ${{ github.event.inputs.steps || 'all' }}

      - name: Local model start-up log
        if: always()
        continue-on-error: true
        run: |
          echo "state: $(cat /tmp/ollama.state 2>/dev/null || echo none)"
          tail -n 20 /tmp/ollama-start.log 2>/dev/null || true

      # Stopped before the export step wrote the site data: export from the database as it is.
      - name: Export after an early stop
        if: steps.pipeline.outcome != 'success' && hashFiles('site/src/data/stories.json') == ''
        working-directory: pipeline
        timeout-minutes: 3
        continue-on-error: true
        run: python -m digest.run export

      # Saved whatever happened above: a copy from a failed run is still correct (it is only ever
      # older than the database, and the next run reads what changed since).
      - name: Save read cache
        if: always() && hashFiles('pipeline/data/cache/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/cache
          key: read-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save share cards
        if: always() && steps.ogcache.outputs.cache-matched-key != format('og-cards-{0}', steps.day.outputs.day) && hashFiles('site/public/og/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/public/og
          key: og-cards-${{ steps.day.outputs.day }}

      # A digest of every episode Pages serves, not the newest name: there are two shows now (the
      # daily briefing and the weekly AI at Work), and the highest name alone would stop changing
      # for a week at a time and with it stop the cache being saved for new briefings.
      - name: Episodes on Pages
        id: episode
        if: always()
        run: |
          files=$(ls site/public/audio/*.mp3 2>/dev/null | xargs -r -n1 basename | sort)
          if [ -n "$files" ]; then
            echo "name=$(printf '%s' "$files" | md5sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Save recent spoken briefings
        if: always() && steps.episode.outputs.name != '' && steps.audiocache.outputs.cache-matched-key != format('audio-recent-{0}', steps.episode.outputs.name)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/public/audio
          key: audio-recent-${{ steps.episode.outputs.name }}

      - name: Save backup store
        if: always() && hashFiles('pipeline/data/backup-store.new') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/backup-store
          key: backup-store-${{ github.run_id }}-${{ github.run_attempt }}

      # The site builds (empty) without stories.json, so never build or deploy without real data.
      - name: Check exported data
        id: data
        run: |
          if python -c "import json,sys; sys.exit(0 if len(json.load(open('site/src/data/stories.json'))) > 0 else 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::site/src/data/stories.json is missing or empty; skipping build and deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save database
        if: env.DATABASE_URL == '' && always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}

      - name: Decide on daily backup
        id: backup
        if: env.DATABASE_URL == ''
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "do=yes" >> "$GITHUB_OUTPUT"; else echo "do=no" >> "$GITHUB_OUTPUT"; fi

      - name: Back up database
        if: env.DATABASE_URL == '' && steps.backup.outputs.do == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: pipeline/data/digest.db
          retention-days: 30
          overwrite: true

      - uses: actions/setup-node@v4
        if: steps.data.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.data.outputs.ok == 'true'
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_KIT_FORM_URL: ${{ vars.PUBLIC_KIT_FORM_URL }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
        run: npm ci && npm run build && echo "digestai.news" > dist/CNAME

      # Cloudflare Pages when its token exists (unmetered bandwidth), otherwise GitHub Pages
      # (free, no secret, 100 GB/month soft limit) so the site is live from day one.
      - name: Deploy to Cloudflare Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=digestai --commit-dirty=true

      - name: Upload site for GitHub Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      # From 24 to 26 Nov 2026, 22 of 59 runs failed here half a second after the upload finished, with
      # "No artifacts named github-pages were found": GitHub lists a new artifact a moment after the upload
      # step reports it. Those runs built the site and never published it. The same deploy a little later
      # finds it, so it is tried again twice before the run fails.
      - name: Deploy to GitHub Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN == ''
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploying again
        if: steps.pages.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (second try)
        if: steps.pages.outcome == 'failure'
        id: pages2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait longer before the last try
        if: steps.pages2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (last try)
        if: steps.pages2.outcome == 'failure'
        id: pages3
        uses: actions/deploy-pages@v4

      # Optional dead man's switch: healthchecks.io emails when this ping stops arriving. Create a check
      # (period 1 hour, grace 2 hours) and save its ping URL as the HEALTHCHECK_URL secret.
      - name: Ping healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: |
          # A run that did not publish is a failure too: no usable data, or every deploy try failed.
          if [ "${{ steps.pipeline.outcome }}" = "success" ] && [ "${{ steps.data.outputs.ok }}" = "true" ] && [ "${{ steps.pages3.outcome }}" != "failure" ]; then
            url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || echo "healthcheck ping failed"

  # Queue the following run, whatever this one's result, unless one is already waiting its turn.
  # A workflow_dispatch made with this run's token does start a run (GitHub's one exception to its
  # no-loops rule). To stop the chain, disable the workflow in the Actions tab.
  next:
    needs: pipeline
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          STARTED: ${{ needs.pipeline.outputs.started }}
        run: |
          waiting=$(gh run list -R "$REPO" --workflow pipeline.yml --limit 20 --json status,databaseId \
            -q "[.[] | select(.databaseId != $THIS_RUN) | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\")] | length")
          if [ "$waiting" = "0" ]; then
            # GitHub sometimes answers a dispatch with HTTP 500 (14 Oct: the chain stopped for an hour
            # on one), so try a few times before giving up to the watchdog.
            for attempt in 1 2 3 4 5; do
              if gh workflow run pipeline.yml -R "$REPO" --ref "$REF" -f chained=true -f after="$STARTED"; then echo "queued the next run"; exit 0; fi
              echo "dispatch failed (attempt $attempt); trying again"; sleep $((attempt * 15))
            done
            exit 1
          else
            echo "a run is already waiting its turn ($waiting); not queueing another"
          fi
