name: Ingest and publish

on:
  schedule:
    # Hourly (was every 30 minutes): the free plan allows 5 GB of database reads a month and this
    # billing cycle (to 11 Oct) is already over it. Runs now read only what changed (~1 MB a run,
    # see the admin Pipeline tab), so */30 would fit (~1.5-2 GB a month); set RUN_MINUTES and
    # RUNS_PER_DAY below to match if the schedule changes.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps (all, or e.g. 'fetch extract')"
        default: "all"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  # write: the media store and the database backup are release assets (pipeline/digest/media.py,
  # backup.py). Releases and tags made with this token start no workflow, so nothing loops.
  contents: write
  pages: write
  id-token: write
  actions: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      SITE_URL: https://digestai.news
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      NEWSLETTER_HOUR_UTC: ${{ vars.NEWSLETTER_HOUR_UTC || '5' }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      ADMIN_REVIEW_KEY: ${{ secrets.ADMIN_REVIEW_KEY }}
      HOLD_RISKY_CLAIMS: ${{ vars.HOLD_RISKY_CLAIMS }}
      RUNS_PER_DAY: "24"
      RUN_MINUTES: "7"
      SUPABASE_CYCLE_DAY: ${{ vars.SUPABASE_CYCLE_DAY || '11' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      AUDIO_ENGINE: ${{ vars.AUDIO_ENGINE || 'kokoro' }}
      AUDIO_VOICE: ${{ vars.AUDIO_VOICE || 'af_heart' }}
      AUDIO_PIPER_VOICE: ${{ vars.AUDIO_PIPER_VOICE || 'en_US-lessac-medium' }}
      # Seconds the audio step may spend reading before it leaves the rest for the next run. Empty
      # keeps the default in pipeline/digest/config.py; raise it on a faster runner.
      AUDIO_TIME_BUDGET_SECONDS: ${{ vars.AUDIO_TIME_BUDGET_SECONDS }}
      # The AI at Work episode shares that budget, behind the briefing. Empty keeps the defaults:
      # Monday (0) from AUDIO_HOUR_UTC, six items, and WORK_AUDIO=0 turns the second show off.
      WORK_AUDIO: ${{ vars.WORK_AUDIO }}
      WORK_AUDIO_WEEKDAY: ${{ vars.WORK_AUDIO_WEEKDAY }}
      WORK_AUDIO_HOUR_UTC: ${{ vars.WORK_AUDIO_HOUR_UTC }}
      WORK_AUDIO_ITEMS: ${{ vars.WORK_AUDIO_ITEMS }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      GEMINI_DAILY_BUDGET: ${{ vars.GEMINI_DAILY_BUDGET || '54' }}
      MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN || '20' }}
      GH_TOKEN: ${{ github.token }}
      # Passphrase that encrypts the nightly database backup (SETUP.md, "Database backup").
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      # Optional: a healthchecks.io ping URL, pinged at the end of every run.
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Restore database
        id: dbcache
        if: env.DATABASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Restore database from backup artifact
        if: env.DATABASE_URL == '' && steps.dbcache.outputs.cache-matched-key == ''
        run: |
          mkdir -p pipeline/data
          run_id=$(gh run list --workflow "Ingest and publish" --status success --limit 30 --json databaseId -q '.[].databaseId' | while read id; do
            if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.artifacts[].name' | grep -qx digest-db; then echo "$id"; break; fi; done)
          if [ -n "$run_id" ]; then gh run download "$run_id" -n digest-db -D pipeline/data && echo "restored backup from run $run_id"; else echo "no backup yet"; fi

      - name: Install pipeline
        run: pip install -q -r pipeline/requirements.txt

      # The spoken briefing's voice (pipeline/digest/audio.py). Kokoro's two model files come from
      # the kokoro-onnx release once and are cached after that; the Piper voice stays as the
      # fallback the audio step uses when they are missing.
      - name: Cache Kokoro model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: pipeline/data/kokoro
          key: kokoro-model-files-v1.0

      - name: Download Kokoro model
        if: steps.kokoro.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          tmp=$(mktemp -d)
          # Both files, or neither: a half-downloaded voice must not end up in the cache.
          curl -fsSL --retry 3 -o "$tmp/kokoro-v1.0.int8.onnx" "$base/kokoro-v1.0.int8.onnx"
          curl -fsSL --retry 3 -o "$tmp/voices-v1.0.bin" "$base/voices-v1.0.bin"
          mkdir -p pipeline/data/kokoro
          mv "$tmp"/* pipeline/data/kokoro/
          ls -l pipeline/data/kokoro

      - name: Cache Piper voice
        id: voice
        uses: actions/cache@v4
        with:
          path: pipeline/data/voices
          key: piper-voice-${{ vars.AUDIO_PIPER_VOICE || 'en_US-lessac-medium' }}

      - name: Download Piper voice
        if: steps.voice.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python -m piper.download_voices "${AUDIO_PIPER_VOICE:-en_US-lessac-medium}" --download-dir pipeline/data/voices

      # Without a Supabase DATABASE_URL the SQLite database persists between runs through the
      # Actions cache, with a daily artifact as backup. The cache is restored from the most
      # recent run; if it is missing, the last backup artifact is used.

      # Local model: the only summariser when no API key exists, and the safety net when the
      # keyed providers run out of quota. Cached after the first run, so it costs ~30 s to start.
      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start local model
        run: |
          # Pinned release: the installer is fetched from ollama.com but installs this exact version.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.12.3 sh >/dev/null 2>&1
          (ollama serve >/tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL" 2>&1 | tail -1
          echo "OLLAMA_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"

      # What earlier runs already read from the database (pipeline/digest/cache.py): each run then asks
      # only for rows written since. One small entry per run under a shared prefix; the newest is
      # restored. Without it a run reads everything once, which costs reads but changes no result.
      # It also carries the parts of a spoken briefing that is still being read (audio.py): losing
      # them costs one episode's synthesis, never a wrong result.
      - name: Restore read cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/cache
          key: read-cache-v1-${{ github.run_id }}
          restore-keys: read-cache-v1-

      # Every share image, thumbnail and spoken briefing is kept in the media store (release assets,
      # pipeline/digest/media.py). Pages also serves the share cards of the last 7 days' stories, thread
      # and topic cards (site/public/og, ~35 MB) and the newest 7 episodes (site/public/audio, ~17 MB),
      # because the store's downloads carry no image or audio type. Those two folders are saved once a
      # day (cards) and when a new episode appears, not every run; anything missing is rendered again or
      # downloaded from the store. The old per-run og-images-/audio- entries expire after 7 days unused;
      # the audio- prefix below carries the existing episodes over once.
      - name: Today's date
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore share cards
        id: ogcache
        uses: actions/cache/restore@v4
        with:
          path: site/public/og
          key: og-cards-${{ steps.day.outputs.day }}
          restore-keys: og-cards-

      - name: Restore recent spoken briefings
        id: audiocache
        uses: actions/cache/restore@v4
        with:
          path: site/public/audio
          key: audio-recent-none
          restore-keys: |
            audio-recent-
            audio-

      # The backup's remembered table rows (a few MB) are needed only by the run that makes the daily
      # backup (pipeline/digest/backup.py), so they are restored and saved on that run only.
      - name: Decide on database backup
        id: dbbackup
        run: |
          due=$(python -c "import json,datetime as d
          try: last=json.load(open('pipeline/data/cache/backup/state.json')).get('lastAt')
          except Exception: last=None
          print('yes' if not last or (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(last)).total_seconds()>=20*3600 else 'no')")
          if [ -z "$BACKUP_KEY" ]; then due=no; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"

      - name: Restore backup store
        if: steps.dbbackup.outputs.due == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/backup-store
          key: backup-store-${{ github.run_id }}
          restore-keys: backup-store-

      # The pipeline has its own limit inside the job's 28 minutes and may fail or time out
      # without stopping the job: the build and deploy steps below still publish what was exported.
      - name: Run pipeline
        id: pipeline
        working-directory: pipeline
        timeout-minutes: 20
        continue-on-error: true
        run: python -m digest.run ${{ github.event.inputs.steps || 'all' }}

      # Stopped before the export step wrote the site data: export from the database as it is.
      - name: Export after an early stop
        if: steps.pipeline.outcome != 'success' && hashFiles('site/src/data/stories.json') == ''
        working-directory: pipeline
        timeout-minutes: 3
        continue-on-error: true
        run: python -m digest.run export

      # Saved whatever happened above: a copy from a failed run is still correct (it is only ever
      # older than the database, and the next run reads what changed since).
      - name: Save read cache
        if: always() && hashFiles('pipeline/data/cache/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/cache
          key: read-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save share cards
        if: always() && steps.ogcache.outputs.cache-matched-key != format('og-cards-{0}', steps.day.outputs.day) && hashFiles('site/public/og/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/public/og
          key: og-cards-${{ steps.day.outputs.day }}

      # A digest of every episode Pages serves, not the newest name: there are two shows now (the
      # daily briefing and the weekly AI at Work), and the highest name alone would stop changing
      # for a week at a time and with it stop the cache being saved for new briefings.
      - name: Episodes on Pages
        id: episode
        if: always()
        run: |
          files=$(ls site/public/audio/*.mp3 2>/dev/null | xargs -r -n1 basename | sort)
          if [ -n "$files" ]; then
            echo "name=$(printf '%s' "$files" | md5sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Save recent spoken briefings
        if: always() && steps.episode.outputs.name != '' && steps.audiocache.outputs.cache-matched-key != format('audio-recent-{0}', steps.episode.outputs.name)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: site/public/audio
          key: audio-recent-${{ steps.episode.outputs.name }}

      - name: Save backup store
        if: always() && hashFiles('pipeline/data/backup-store.new') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/backup-store
          key: backup-store-${{ github.run_id }}-${{ github.run_attempt }}

      # The site builds (empty) without stories.json, so never build or deploy without real data.
      - name: Check exported data
        id: data
        run: |
          if python -c "import json,sys; sys.exit(0 if len(json.load(open('site/src/data/stories.json'))) > 0 else 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::site/src/data/stories.json is missing or empty; skipping build and deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save database
        if: env.DATABASE_URL == '' && always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}

      - name: Decide on daily backup
        id: backup
        if: env.DATABASE_URL == ''
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "do=yes" >> "$GITHUB_OUTPUT"; else echo "do=no" >> "$GITHUB_OUTPUT"; fi

      - name: Back up database
        if: env.DATABASE_URL == '' && steps.backup.outputs.do == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: pipeline/data/digest.db
          retention-days: 30
          overwrite: true

      - uses: actions/setup-node@v4
        if: steps.data.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.data.outputs.ok == 'true'
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_KIT_FORM_URL: ${{ vars.PUBLIC_KIT_FORM_URL }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
        run: npm ci && npm run build && echo "digestai.news" > dist/CNAME

      # Cloudflare Pages when its token exists (unmetered bandwidth), otherwise GitHub Pages
      # (free, no secret, 100 GB/month soft limit) so the site is live from day one.
      - name: Deploy to Cloudflare Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=digestai --commit-dirty=true

      - name: Upload site for GitHub Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        if: steps.data.outputs.ok == 'true' && env.CF_TOKEN == ''
        id: pages
        uses: actions/deploy-pages@v4

      # Optional dead man's switch: healthchecks.io emails when this ping stops arriving. Create a check
      # (period 1 hour, grace 2 hours) and save its ping URL as the HEALTHCHECK_URL secret.
      - name: Ping healthchecks.io
        if: always() && env.HEALTHCHECK_URL != ''
        continue-on-error: true
        run: |
          if [ "${{ steps.pipeline.outcome }}" = "success" ]; then url="$HEALTHCHECK_URL"; else url="$HEALTHCHECK_URL/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || echo "healthcheck ping failed"
