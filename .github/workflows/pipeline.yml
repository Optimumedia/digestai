name: Ingest and publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps (all, or e.g. 'fetch extract')"
        default: "all"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SITE_URL: https://digestai.news
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      NEWSLETTER_HOUR_UTC: ${{ vars.NEWSLETTER_HOUR_UTC || '5' }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
      GEMINI_DAILY_BUDGET: ${{ vars.GEMINI_DAILY_BUDGET || '54' }}
      MAX_ENRICH_PER_RUN: ${{ vars.MAX_ENRICH_PER_RUN || '20' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-bge-small-en-v1.5

      - name: Cache share images
        uses: actions/cache@v4
        with:
          path: site/public/og
          key: og-images-${{ github.run_id }}
          restore-keys: og-images-

      # Without a Supabase DATABASE_URL the SQLite database persists between runs through the
      # Actions cache, with a daily artifact as backup. The cache is restored from the most
      # recent run; if it is missing, the last backup artifact is used.
      - name: Restore database
        id: dbcache
        if: env.DATABASE_URL == ''
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      - name: Restore database from backup artifact
        if: env.DATABASE_URL == '' && steps.dbcache.outputs.cache-matched-key == ''
        run: |
          mkdir -p pipeline/data
          run_id=$(gh run list --workflow "Ingest and publish" --status success --limit 30 --json databaseId -q '.[].databaseId' | while read id; do
            if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.artifacts[].name' | grep -qx digest-db; then echo "$id"; break; fi; done)
          if [ -n "$run_id" ]; then gh run download "$run_id" -n digest-db -D pipeline/data && echo "restored backup from run $run_id"; else echo "no backup yet"; fi

      - name: Install pipeline
        run: pip install -q -r pipeline/requirements.txt

      # Local model: the only summariser when no API key exists, and the safety net when the
      # keyed providers run out of quota. Cached after the first run, so it costs ~30 s to start.
      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start local model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
          (ollama serve >/tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL" 2>&1 | tail -1
          echo "OLLAMA_URL=http://127.0.0.1:11434" >> "$GITHUB_ENV"

      - name: Run pipeline
        working-directory: pipeline
        run: python -m digest.run ${{ github.event.inputs.steps || 'all' }}

      - name: Save database
        if: env.DATABASE_URL == '' && always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/data/digest.db
          key: digest-db-${{ github.run_id }}

      - name: Decide on daily backup
        id: backup
        if: env.DATABASE_URL == ''
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 30 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "do=yes" >> "$GITHUB_OUTPUT"; else echo "do=no" >> "$GITHUB_OUTPUT"; fi

      - name: Back up database
        if: env.DATABASE_URL == '' && steps.backup.outputs.do == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: pipeline/data/digest.db
          retention-days: 30
          overwrite: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_KIT_FORM_URL: ${{ vars.PUBLIC_KIT_FORM_URL }}
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
        run: npm ci && npm run build && echo "digestai.news" > dist/CNAME

      # Cloudflare Pages when its token exists (unmetered bandwidth), otherwise GitHub Pages
      # (free, no secret, 100 GB/month soft limit) so the site is live from day one.
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=digestai --commit-dirty=true

      - name: Upload site for GitHub Pages
        if: env.CF_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        if: env.CF_TOKEN == ''
        id: pages
        uses: actions/deploy-pages@v4
